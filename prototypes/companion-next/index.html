<style>

@media(prefers-color-scheme:dark){:root{--bg:#191c20;--panel:#22262b;--ink:#e5e7eb;--muted:#a2aab5;--line:#3b424b;--soft:#2c3138;--accent:#83d1bd;--accentbg:#233e38;--bad:#ff9b92;--badbg:#452c2c;--warn:#e7bf70;--warnbg:#463b27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}button:hover:not(:disabled){background:var(--soft)}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accentbg);color:var(--accent);border-color:var(--accent);font-weight:650}.ghost{border-color:transparent;background:transparent}.small{font-size:12px;padding:4px 8px}.muted{color:var(--muted)}.mono,textarea,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}h1,h2,h3,p{margin:0}h1{font-size:21px;font-weight:650}h2{font-size:15px}h3{font-size:14px}header{height:60px;display:flex;align-items:center;gap:10px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-size:17px;font-weight:700;letter-spacing:-.5px}.grow{flex:1}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 60px)}aside{border-right:1px solid var(--line);padding:18px 12px;background:var(--bg)}.sidehead{padding:0 6px 10px;font-size:12px;color:var(--muted)}.tree{margin:12px 0}.file{width:100%;display:flex;align-items:center;text-align:left;gap:8px;border:0;background:transparent;border-radius:6px;padding:8px 10px}.file.active{background:var(--accentbg);color:var(--accent);font-weight:650}.folder{font-size:12px;color:var(--muted);padding:10px 10px 3px}.file span:last-child{margin-left:auto;font-size:11px}.sidebottom{border-top:1px solid var(--line);padding-top:12px;margin-top:22px}.main{padding:28px 36px;max-width:1060px;width:100%;margin:0 auto}.sub{margin:4px 0 18px;color:var(--muted);font-size:12px}.toolbar{margin-bottom:25px}.rule{border:0;border-top:1px solid var(--line);margin:18px 0}.casebar{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0}.tab{background:transparent;border-color:transparent;color:var(--muted)}.tab.active{border-color:var(--line);background:var(--panel);color:var(--ink);font-weight:650}.surface{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.section{margin-top:16px}.label{font-weight:600;font-size:12px;display:block;margin:12px 0 5px}.field,textarea,select{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;width:100%}textarea{resize:vertical;min-height:66px;line-height:1.5}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.output{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:12px;min-height:92px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}.ok{color:var(--accent)}.bad{color:var(--bad)}.warn{color:var(--warn)}.banner{padding:10px 12px;border-radius:7px;background:var(--soft);margin:12px 0}.banner.bad{background:var(--badbg)}.banner.warn{background:var(--warnbg)}.banner.ok{background:var(--accentbg)}.empty{display:grid;place-items:center;text-align:center;min-height:65vh}.empty>div{max-width:430px}.empty p{margin:10px 0 20px}dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:22px;width:min(540px,calc(100% - 24px));max-height:85vh}dialog::backdrop{background:#1118}dialog h2{font-size:18px;margin-bottom:12px}dialog .footer{margin-top:18px;justify-content:flex-end}.manual{width:min(650px,calc(100% - 24px))}.manual pre{background:var(--soft);padding:12px;border-radius:6px;white-space:pre-wrap}.entry{border-bottom:1px solid var(--line);padding:12px 0}.entry:last-child{border-bottom:0}.toast{position:fixed;bottom:18px;right:18px;max-width:calc(100% - 36px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;box-shadow:0 6px 24px #0002;z-index:9}.diff{background:var(--badbg);color:var(--bad);font-weight:650}.demo{font-size:11px;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:5px}.hidden{display:none!important}@media(max-width:680px){header{padding:0 10px;height:auto;min-height:56px;flex-wrap:wrap}.shell{grid-template-columns:125px minmax(0,1fr)}aside{padding:10px 5px}.main{padding:18px 12px}.split{grid-template-columns:1fr}.toolbar button{font-size:12px}.brand{font-size:15px}.sidehead{overflow-wrap:anywhere}}
</style></head>
<body>
<header><span class="brand">Companion</span><span class="demo">交互原型 · 模拟数据</span><div class="grow"></div><button class="ghost" id="openBtn">打开文件</button><button class="ghost" id="folderBtn">打开文件夹</button><button class="ghost" id="manualBtn">函数手册</button><button class="ghost" id="settingsBtn">设置</button></header>
<div class="shell"><aside><div class="row between sidehead"><strong>文件</strong><button id="newBtn" class="small" title="新建源文件">＋ 新建</button></div><div id="tree" class="tree"></div><div class="sidebottom"><button id="demoBtn" class="ghost small">演示场景 ▾</button><p class="muted" style="font-size:11px;padding:8px">本页面不读取真实文件、不编译、不联网。</p></div></aside><main class="main" id="main"></main></div>
<dialog id="modal"></dialog><div class="toast hidden" id="toast" role="status"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain='#include <stdio.h>\nint main(void) {\n    return 0;\n}\n';
const kit='#include ".companion/resources/expanded.h"\n'+plain;
const sum='#include <stdio.h>\nint main(void) {\n    int n, x, s = 0;\n    scanf("%d", &n);\n    for (int i = 0; i < n; i++) { scanf("%d", &x); s += x; }\n    printf("%d\\n", s);\n    return 0;\n}\n';
const mkcase=(input="",expected="",compare=true,actual=null)=>({input,expected,compare,actual,state:"未运行",result:null});
const makeFile=(name,usesKit=false,cases=[],source=plain,scenario="ok")=>({name,usesKit,cases,source,scenario,selected:0,revision:0,stale:false});
let dirs={"C语言练习":[makeFile("A.c",true,[mkcase("5\n1 2 3 4 5","15",true,"15")],kit),makeFile("B.c",false,[mkcase("1\n10","10",true,"10"),mkcase("3\n1 2 3","6",true,"5")],sum),makeFile("练习/C.c",false,[],plain)],"期末考试":[makeFile("A.c",false,[],plain)],"空文件夹":[]};
let directory=null,current=null,busy=false,runTimer=null,settings={compiler:"auto",editor:"系统默认",observer:true,resource:true};
const f=()=>current;const activeCase=()=>f()?.cases[f().selected];
function notify(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(notify.timer);notify.timer=setTimeout(()=>$("toast").classList.add("hidden"),3500)}
function dialog(title,body,cls=""){const d=$("modal");d.className=cls;d.innerHTML='<h2>'+esc(title)+'</h2>'+body; if(!d.open)d.showModal();}
function close(){ $("modal").close() }
function chooseFile(dir,file){if(busy){notify("请先取消当前测试");return}directory=dir;current=file??dirs[dir][0]??null;close();render()}
function openPicker(kind){const list=Object.entries(dirs).map(([d,files])=>'<div class="entry"><strong>'+esc(d)+'</strong><div class="row section">'+(kind==="folder"?'<button data-open-dir="'+esc(d)+'">打开此文件夹</button>':files.map((x,i)=>'<button data-open-dir="'+esc(d)+'" data-index="'+i+'">'+esc(x.name)+'</button>').join("")||'<span class="muted">没有源文件</span>')+'</div></div>').join("");dialog(kind==="folder"?"打开文件夹 · 模拟":"打开文件 · 模拟",'<p class="muted">选择演示文件；打开单文件会自动打开其父目录。</p>'+list+'<div class="row footer"><button data-close>取消</button></div>');$("modal").querySelectorAll("[data-open-dir]").forEach(b=>b.onclick=()=>{let d=b.dataset.openDir,x=b.dataset.index===undefined?undefined:dirs[d][Number(b.dataset.index)];if(x&&x.name.includes("/")){const prefix=x.name.slice(0,x.name.lastIndexOf("/"));const name=d+"/"+prefix;if(!dirs[name])dirs[name]=dirs[d].filter(y=>y.name.startsWith(prefix+"/")).map(y=>({...y,name:y.name.slice(prefix.length+1)}));chooseFile(name,dirs[name].find(y=>y.name===x.name.slice(prefix.length+1)));}else chooseFile(d,x)})}
function newFile(){if(busy)return notify("请先取消当前测试");dialog("新建源文件",'<label class="label" for="newDir">保存位置</label><select id="newDir">'+Object.keys(dirs).map(d=>'<option '+(d===directory?"selected":"")+'>'+esc(d)+'</option>').join("")+'</select><label class="label" for="newName">文件名</label><input class="field" id="newName" value="D.c"><p class="muted section">C 文件默认引入 Exam Kit；C++ 使用普通模板。不会覆盖已有文件。</p><p id="newError" class="bad"></p><div class="row footer"><button data-close>取消</button><button class="primary" id="create">新建</button></div>');$("create").onclick=()=>{let d=$("newDir").value,n=$("newName").value.trim();if(!/^[^<>:"/\\|?*]+\.(c|cpp|cc|cxx)$/i.test(n))return $("newError").textContent="请输入有效的 C/C++ 文件名";if(dirs[d].some(x=>x.name.toLowerCase()===n.toLowerCase()))return $("newError").textContent="同名文件已存在";let c=/\.c$/i.test(n);if(c&&!settings.resource)return $("newError").textContent="Exam Kit 未安装，请通过 Routilet 准备资源（模拟）";let x=makeFile(n,c,[],c?kit:plain);dirs[d].push(x);chooseFile(d,x);notify("已模拟新建 "+n)}}
function renderTree(){let h=directory?'<div class="folder">'+esc(directory)+'</div>': '<p class="muted" style="padding:8px">尚未打开文件夹</p>';if(directory){let prefix="";dirs[directory].forEach((x,i)=>{let p=x.name.includes("/")?x.name.split("/")[0]:"";if(p&&p!==prefix)h+='<div class="folder">▾ '+esc(p)+'</div>';prefix=p;let status=x.stale?"过期":x.cases.length&&x.cases.every(c=>c.state==="通过")?"✓":"";h+='<button class="file '+(x===f()?"active":"")+'" data-file="'+i+'" '+(p?'style="padding-left:22px"':'')+'><span>⌘</span>'+esc(x.name.split("/").pop())+'<span>'+status+'</span></button>'})} $("tree").innerHTML=h;$("tree").querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>chooseFile(directory,dirs[directory][+b.dataset.file]))}
function diffText(expected,actual){let a=String(actual),e=String(expected),p=0,s=0;while(p<a.length&&p<e.length&&a[p]===e[p])p++;while(s<a.length-p&&s<e.length-p&&a[a.length-1-s]===e[e.length-1-s])s++;return esc(a.slice(0,p))+"<span class=\"diff\">"+esc(a.slice(p,a.length-s)||"∅")+"</span>"+esc(s?a.slice(-s):"");}
function render(){renderTree();let x=f();if(!x){$("main").innerHTML='<div class="empty"><div><h1>'+(directory?'这个文件夹还没有源文件':'打开你的代码')+'</h1><p class="muted">直接使用已有 C/C++ 文件。无需账号或工作区初始化。</p><div class="row" style="justify-content:center"><button class="primary" data-act="open">打开文件</button><button data-act="folder">打开文件夹</button><button data-act="new">新建文件</button></div><p class="muted" style="font-size:12px">也可以先查阅函数手册。</p></div></div>';return}
let c=activeCase(),passed=x.cases.filter(c=>c.state==="通过").length,completed=x.cases.filter(c=>c.state!=="未运行").length,comparisons=x.cases.filter(c=>c.compare).length;
let h='<div class="row between"><h1>'+esc(x.name.split("/").pop())+'</h1><span class="muted">'+(x.usesKit?"C99 · Exam Kit":/\.c$/i.test(x.name)?"C99":"C++17")+'</span></div><p class="sub">'+esc(directory+"/"+x.name)+' · 模拟本地文件</p><div class="row toolbar"><button data-act="editor">打开编辑器 ↗</button><button data-act="copy">复制提交源码</button><button class="primary" data-act="runall" '+(busy?"disabled":"")+'>运行全部测试</button>'+(busy?'<button data-act="cancel">取消运行</button>':'')+'</div>';
if(x.stale)h+='<div class="banner warn">源码或测试数据已修改，先前结果已过期。重新测试以验证当前版本。</div>';
h+='<div class="row between"><h2>测试数据</h2><div class="row"><span class="muted">'+(x.stale?'结果已过期':completed?(comparisons?passed+' / '+comparisons+' 通过':'已运行 '+completed+' 组'):'尚未运行')+'</span><button class="small" data-act="add">＋ 添加</button></div></div>';
if(!c){h+='<div class="surface section"><p>还没有测试数据</p><p class="muted section">粘贴输入和可选预期输出；没有预期输出也能运行程序。</p><div class="row section"><button class="primary" data-act="add">添加测试</button><button data-act="emptyrun">空输入运行</button></div></div>';$("main").innerHTML=h;return}
h+='<div class="casebar" role="group" aria-label="测试列表">'+x.cases.map((c,i)=>'<button class="tab '+(i===x.selected?"active":"")+'" data-case="'+i+'">'+(x.stale?"◌":c.state==="通过"?"✓":c.state==="未运行"?"○":c.state==="已运行"?"•":"×")+' 样例 '+(i+1)+'</button>').join("")+'</div>';
h+='<div class="surface"><div class="row between"><h3>样例 '+(x.selected+1)+'</h3><button class="ghost small" data-act="remove" '+(busy?"disabled":"")+'>删除样例</button></div><label class="label" for="input">输入</label><textarea id="input" rows="3" '+(busy?"disabled":"")+'>'+esc(c.input)+'</textarea><label class="label"><input type="checkbox" id="compare" '+(c.compare?"checked":"")+' '+(busy?"disabled":"")+'> 比较预期输出</label><textarea id="expected" rows="2" '+(!c.compare||busy?"disabled":"")+' placeholder="明确留空表示预期无输出">'+esc(c.expected)+'</textarea><div class="row section"><button class="primary" data-act="run" '+(busy?"disabled":"")+'>运行当前样例</button><button data-act="observe" '+(busy||!settings.observer?"disabled":"")+'>运行观察 ↗</button>'+(!settings.observer?'<span class="muted">Observer 未安装</span>':'')+'</div></div>';
if(busy)h+='<div class="banner">正在模拟编译与运行…</div>';else if(c.result){let result=c.result,cl=c.state==="通过"||c.state==="已运行"?"ok":"bad";h+='<div class="section"><div class="row between"><h2>测试结果</h2><span class="'+(x.stale?"warn":cl)+'">'+esc(x.stale?"已过期 · "+c.state:c.state)+'</span></div>';if(result.error)h+='<div class="banner bad">'+esc(result.error)+'</div>';else h+='<div class="split section">'+(result.compare?'<div><span class="muted">预期输出</span><pre class="output">'+esc(result.expected||"(空输出)")+'</pre></div>':'')+'<div><span class="muted">实际输出</span><pre class="output">'+(c.state==="输出不一致"?diffText(result.expected,result.actual):esc(result.actual||"(空输出)"))+'</pre></div></div>';h+='</div>'}
$("main").innerHTML=h;
$("input").oninput=e=>{c.input=e.target.value;invalidate(x,false)};$("expected").oninput=e=>{c.expected=e.target.value;invalidate(x,false)};$("compare").onchange=e=>{c.compare=e.target.checked;invalidate(x,true)};
}
function invalidate(x,rerender=true){x.revision++;if(x.cases.some(c=>c.result))x.stale=true;if(rerender)render();else{renderTree();if(x.stale&&!$("main").querySelector(".banner.warn")){let b=document.createElement("div");b.className="banner warn";b.textContent="测试数据已修改，先前结果已过期。";$("main").querySelector(".toolbar").after(b)}}}
function run(all){let x=f();if(!x||busy)return;if(!x.cases.length){x.cases.push(mkcase("","",false));x.selected=0}busy=true;render();runTimer=setTimeout(()=>{let indices=all?x.cases.map((_,i)=>i):[x.selected];for(let i of indices){let c=x.cases[i];let err={compile:"main.c:5:12: error: expected ';' before 'return'",runtime:"程序异常退出（模拟 exit 1）",timeout:"运行超时（模拟 2 秒）",missing:"未找到编译器，请在设置中指定路径"}[settings.compiler==="missing"?"missing":x.scenario];if(err){c.state=({compile:"编译失败",runtime:"运行失败",timeout:"超时",missing:"编译器缺失"})[settings.compiler==="missing"?"missing":x.scenario];c.result={error:err}}else{let actual=c.actual??"0";c.state=!c.compare?"已运行":actual===c.expected?"通过":"输出不一致";c.result={actual,expected:c.expected,compare:c.compare}};c.result.revision=x.revision}x.stale=false;if(!all)x.cases.forEach((c,i)=>{if(i!==x.selected&&c.result&&c.result.revision!==x.revision){c.result=null;c.state="未运行"}});if(all){let fail=x.cases.findIndex(c=>!["通过","已运行"].includes(c.state));if(fail>=0)x.selected=fail}busy=false;render()},550)}
function cancel(){clearTimeout(runTimer);busy=false;render();notify("已取消模拟运行")}
async function copyText(s){try{await navigator.clipboard.writeText(s);notify("已复制演示文本")}catch{dialog("复制演示文本",'<p class="muted">浏览器未提供剪贴板权限，请手动复制。</p><textarea id="fallback" rows="8" readonly>'+esc(s)+'</textarea><div class="row footer"><button data-close>关闭</button></div>');$("fallback").select()}}
function copySource(){let x=f();if(!x)return;let code=x.usesKit?x.source.replace(/^#include ".companion\/resources\/expanded.h"\n/,""):x.source;dialog("复制提交源码 · 模拟",'<p class="muted">下方是预置演示源码，不是实际装配或编译结果。'+(x.stale||!x.cases.some(c=>c.state==="通过")?" 当前版本未通过验证。":"")+'</p><textarea rows="10" readonly>'+esc(code)+'</textarea><div class="row footer"><button data-close>取消</button><button class="primary" id="copyConfirm">复制演示源码</button></div>');$("copyConfirm").onclick=()=>{close();copyText(code)}}
const manual=[["输入输出","read_int","读取一个整数","int n = read_int();"],["输入输出","read_double","读取浮点数","double x = read_double();"],["数组","print_ints","打印整数数组","print_ints(a, n);"]];
function showManual(){dialog("函数手册 · 演示",'<input id="search" class="field" placeholder="搜索函数名称或中文用途"><p class="muted section">示意条目，实际签名及内容以 Exam Kit 资源为准。</p><div id="entries"></div><div class="row footer"><button data-close>关闭</button></div>',"manual");function results(){let q=$("search").value.toLowerCase();$("entries").innerHTML=manual.map((m,i)=>({m,i})).filter(({m})=>m.join(" ").toLowerCase().includes(q)).map(({m,i})=>'<div class="entry"><span class="muted">'+esc(m[0])+'</span><h3 class="mono">'+esc(m[1])+'</h3><p>'+esc(m[2])+'</p><pre>'+esc(m[3])+'</pre><button class="small" data-manual="'+i+'">复制示例</button></div>').join("")||'<p class="muted section">没有匹配结果</p>';$("entries").querySelectorAll("[data-manual]").forEach(b=>b.onclick=()=>copyText(manual[+b.dataset.manual][3]))}$("search").oninput=results;results();$("search").focus()}
function showSettings(){if(busy)return notify("请先取消当前测试");dialog("设置",'<label class="label" for="compiler">编译器</label><select id="compiler"><option value="auto">系统默认（模拟可用）</option><option value="missing">模拟找不到编译器</option></select><label class="label" for="editor">编辑器</label><select id="editor"><option>系统默认</option><option>Dev-C++</option><option>VS Code</option></select><label class="label"><input id="observerAvailable" type="checkbox"> 模拟已安装 Observer</label><label class="label"><input id="kitAvailable" type="checkbox"> 模拟已安装 Exam Kit</label><p class="muted">应用及资源安装由 Routilet 负责。此处仅模拟可用状态。</p><div class="row footer"><button data-close>取消</button><button class="primary" id="saveSettings">保存</button></div>');$("compiler").value=settings.compiler;$("editor").value=settings.editor;$("observerAvailable").checked=settings.observer;$("kitAvailable").checked=settings.resource;$("saveSettings").onclick=()=>{settings={compiler:$("compiler").value,editor:$("editor").value,observer:$("observerAvailable").checked,resource:$("kitAvailable").checked};if(f())invalidate(f(),false);close();render()}}
function demo(){dialog("演示场景",'<p class="muted">模拟真实后端将来提供的状态。</p><div class="row section">'+[["empty","返回首次启动"],["save","外部保存当前源码"],["add","外部新增 E.c"],["ok","正常运行"],["compile","编译失败"],["runtime","异常退出"],["timeout","运行超时"]].map(([v,t])=>'<button data-demo="'+v+'">'+t+'</button>').join("")+'</div><div class="row footer"><button data-close>关闭</button></div>');$("modal").querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{if(busy){notify("请先取消当前测试");return}let a=b.dataset.demo;close();if(a==="empty"){directory=null;current=null;render();return}if(!directory)chooseFile("C语言练习");if(a==="add"){if(!dirs[directory].some(x=>x.name==="E.c"))dirs[directory].push(makeFile("E.c"));render();notify("已模拟发现新文件");return}if(!f())return notify("请先选择源文件");if(a==="save"){f().source+="\n";invalidate(f());notify("已模拟外部保存");return}f().scenario=a;invalidate(f());notify("场景已切换，点击运行测试")})}
$("main").onclick=e=>{let b=e.target.closest("button");if(!b||b.disabled)return;if(b.dataset.case!==undefined){if(busy)return;f().selected=+b.dataset.case;render();return}let a=b.dataset.act,x=f();switch(a){case "open":openPicker("file");break;case "folder":openPicker("folder");break;case "new":newFile();break;case "editor":notify("模拟打开 "+settings.editor+" · "+x.name);break;case "copy":copySource();break;case "add":if(busy)return;x.cases.push(mkcase());x.selected=x.cases.length-1;invalidate(x);break;case "remove":x.cases.splice(x.selected,1);x.selected=Math.max(0,Math.min(x.selected,x.cases.length-1));invalidate(x);break;case "emptyrun":run(false);break;case "run":run(false);break;case "runall":run(true);break;case "cancel":cancel();break;case "observe":dialog("运行观察 · 模拟",'<p>将当前源码与样例输入传给独立 Observer 窗口。</p><pre class="output">'+esc(activeCase()?.input||"(空输入)")+'</pre><div class="row footer"><button data-close>关闭</button></div>');break}};
$("openBtn").onclick=()=>openPicker("file");$("folderBtn").onclick=()=>openPicker("folder");$("newBtn").onclick=newFile;$("manualBtn").onclick=showManual;$("settingsBtn").onclick=showSettings;$("demoBtn").onclick=demo;
$("modal").addEventListener("click",e=>{if(e.target.closest("[data-close]"))close()});document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="o"){e.preventDefault();openPicker("file")}if((e.ctrlKey||e.metaKey)&&e.key==="Enter"&&!$("modal").open){e.preventDefault();run(false)}});
document.addEventListener("dragover",e=>e.preventDefault());document.addEventListener("drop",e=>{e.preventDefault();notify("原型不读取拖入的真实文件，请使用模拟文件选择");openPicker("file")});
render();
</script></body></html>
