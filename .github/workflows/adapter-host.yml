name: Adapter host CI (no publishing)
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/ojadapter/**'
      - '.github/workflows/adapter-host.yml'
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Routilet/accoding-adapter
          ref: e959f9a774cd26fd5932e46251a33b91a3b7a709
          path: adapter-fixture
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Real adapter and host (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          if ((go env GOARCH) -ne 'amd64') { throw 'expected amd64' }
          $adapter = Join-Path $env:RUNNER_TEMP 'accoding-adapter.exe'
          Push-Location adapter-fixture
          try {
            go build -mod=readonly -o $adapter ./cmd/accoding-adapter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $env:COMPANION_TEST_ADAPTER = $adapter
          $env:COMPANION_TEST_SYSTEM_CREDENTIALS = '1'
          go test -mod=readonly -count=1 -v ./internal/ojadapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly ./internal/ojadapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real adapter and host (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          adapter="$RUNNER_TEMP/accoding-adapter"
          (cd adapter-fixture && CGO_ENABLED=0 go build -mod=readonly -o "$adapter" ./cmd/accoding-adapter)
          COMPANION_TEST_ADAPTER="$adapter" go test -mod=readonly -count=1 -v ./internal/ojadapter
          go vet -mod=readonly ./internal/ojadapter
